[project]
name = "missingmcp"
version = "0.1.0"
description = "MissingMCP — multi-user OAuth 2.1 gateway serving the connectors Claude is missing (Garmin via the unmodified garmin_mcp worker)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charles", email = "JustinMist@users.noreply.github.com" }]
keywords = ["mcp", "missingmcp", "garmin", "oauth", "claude", "garmin-connect"]
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Reviewed minimum change carrying CN DI endpoint routing and the token-file
    # permission fix. Docker/CI apply this exact gateway-locked version to the
    # separately pinned garmin-mcp worker venv as well.
    "garminconnect==0.3.6",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    # PostHog telemetry (telemetry.py). The SDK is thread-based (no asyncio) and
    # pulls a second HTTP stack (requests) — accepted in the 2026-07-20 design
    # spec. 0-cost when POSTHOG_API_KEY is unset: telemetry.init() is a no-op.
    "posthog>=7.27,<8",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.urls]
Homepage = "https://github.com/JustinMist/missingmcp"
Repository = "https://github.com/JustinMist/missingmcp"
Issues = "https://github.com/JustinMist/missingmcp/issues"

[project.scripts]
missingmcp = "missingmcp.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missingmcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream deprecation from newer Starlette: its TestClient warns about httpx vs
    # httpx2. We use httpx (>=0.27) directly in proxy.py at runtime and only touch
    # TestClient in tests, so this is not actionable here — keep test output pristine.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
